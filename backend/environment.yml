name: xuanji
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    - fastapi>=0.100
    - uvicorn[standard]
    - sqlalchemy>=2.0
    - pymysql
    - cryptography
    - pydantic>=2.0
    - pydantic-settings
    - alembic
    - httpx
    - python-dotenv
    - python-multipart
    - python-jose[cryptography]
    - passlib[bcrypt]
    - email-validator
    - pytest
    - pytest-asyncio
